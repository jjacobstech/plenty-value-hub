openapi: 3.1.0
info:
  title: Plenty Value Partner API
  version: "2026-10-01"
  description: |
    Affiliate and referral tracking infrastructure for partner platforms.
    Authenticate with a secret key: `Authorization: Bearer pv_live_sk_...` (or `pv_test_sk_...` for test mode).
    All POST requests accept an `Idempotency-Key` header. Money is integer minor units.
    See SPEC.md for behaviour that this contract does not express.
servers:
  - url: https://api.plentyvalue.com
    description: Production (replace with real host)
security:
  - bearerAuth: []

tags:
  - name: Affiliates
  - name: Links
  - name: Redirect
  - name: Events
  - name: Commissions
  - name: Stats
  - name: Dashboard
  - name: Utility

paths:
  /v1/ping:
    get:
      tags: [Utility]
      summary: Check credentials
      operationId: ping
      responses:
        "200":
          description: Key is valid
          content:
            application/json:
              schema:
                type: object
                required: [object, partner_id, livemode]
                properties:
                  object: { type: string, const: ping }
                  partner_id: { type: string, example: ptn_8Fh2kQ1zLm0aPq9xYt3B }
                  livemode: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/affiliates:
    post:
      tags: [Affiliates]
      summary: Create or get an affiliate by external_user_id
      operationId: createAffiliate
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [external_user_id]
              properties:
                external_user_id: { type: string, maxLength: 191, example: "brk_user_10293" }
                email: { type: string, format: email }
                display_name: { type: string, maxLength: 120 }
                metadata: { $ref: "#/components/schemas/Metadata" }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Affiliate" } } }
        "200":
          description: Already existed, returned unchanged
          content: { application/json: { schema: { $ref: "#/components/schemas/Affiliate" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      tags: [Affiliates]
      summary: List affiliates
      operationId: listAffiliates
      parameters:
        - in: query
          name: external_user_id
          schema: { type: string }
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/AffiliateStatus" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
      responses:
        "200":
          description: Page of affiliates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AffiliateList" }

  /v1/affiliates/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Affiliates]
      summary: Retrieve an affiliate
      operationId: getAffiliate
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/Affiliate" } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Affiliates]
      summary: Update an affiliate (status, display fields, metadata)
      operationId: updateAffiliate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status: { $ref: "#/components/schemas/AffiliateStatus" }
                email: { type: [string, "null"], format: email }
                display_name: { type: [string, "null"], maxLength: 120 }
                metadata: { $ref: "#/components/schemas/Metadata" }
      responses:
        "200":
          description: Updated
          content: { application/json: { schema: { $ref: "#/components/schemas/Affiliate" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/affiliates/{id}/stats:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Stats]
      summary: Stats for one affiliate
      operationId: getAffiliateStats
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - in: query
          name: group_by
          schema: { type: string, enum: [none, day, product, campaign], default: none }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/Stats" } } }

  /v1/affiliates/{id}/dashboard_sessions:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Dashboard]
      summary: Create a single-use login link to the hosted affiliate dashboard
      operationId: createDashboardSession
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                return_url: { type: string, format: uri }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [object, id, url, expires_at]
                properties:
                  object: { type: string, const: dashboard_session }
                  id: { type: string, example: dss_x8LmQ2... }
                  url: { type: string, format: uri, example: "https://api.plentyvalue.com/a/session/AbC..." }
                  expires_at: { type: integer, description: Unix seconds, 5 minutes from creation }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/links:
    post:
      tags: [Links]
      summary: Create or get a referral link for an affiliate and product or campaign
      operationId: createLink
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [affiliate, destination_url]
              properties:
                affiliate: { type: string, description: Affiliate public id (aff_...) }
                product_ref: { type: string, maxLength: 191 }
                campaign_ref: { type: string, maxLength: 191 }
                destination_url:
                  type: string
                  format: uri
                  description: Host must be in the partner's allowed_redirect_domains
                update_destination:
                  type: boolean
                  default: false
                  description: If the link exists with another destination, update it
                metadata: { $ref: "#/components/schemas/Metadata" }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Link" } } }
        "200":
          description: Existing link returned
          content: { application/json: { schema: { $ref: "#/components/schemas/Link" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      tags: [Links]
      summary: List links
      operationId: listLinks
      parameters:
        - in: query
          name: affiliate
          schema: { type: string }
        - in: query
          name: product_ref
          schema: { type: string }
        - in: query
          name: campaign_ref
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
      responses:
        "200":
          description: Page of links
          content: { application/json: { schema: { $ref: "#/components/schemas/LinkList" } } }

  /v1/links/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Links]
      summary: Retrieve a link
      operationId: getLink
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/Link" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/links/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Links]
      summary: Disable a link (redirect stops crediting clicks)
      operationId: disableLink
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Disabled
          content: { application/json: { schema: { $ref: "#/components/schemas/Link" } } }

  /r/{code}:
    get:
      tags: [Redirect]
      summary: Public redirect. No authentication.
      operationId: redirect
      security: []
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirect to destination_url with `pv_click_id=clk_...` (param name configurable) appended
          headers:
            Location: { schema: { type: string } }
        "404":
          description: Unknown code and no fallback URL configured (HTML page)

  /v1/events:
    post:
      tags: [Events]
      summary: Report a qualifying conversion event
      description: |
        Deduplicated by `event_id`: sending the same event_id again returns the original event with 200.
        Provide one attribution hint: `click_id` (preferred), `link_id` or `affiliate_id`.
      operationId: createEvent
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event_id, type]
              properties:
                event_id: { type: string, maxLength: 191, description: Your unique id for this event, example: "reg_10294" }
                type: { type: string, example: registration, description: Must be in program allowed_event_types }
                click_id: { type: string, example: clk_Q9vT... }
                link_id: { type: string }
                affiliate_id: { type: string }
                referred_external_user_id: { type: string, maxLength: 191 }
                amount: { type: integer, minimum: 0, description: Minor units. Required for percent commissions }
                currency: { type: string, minLength: 3, maxLength: 3 }
                occurred_at: { type: integer, description: Unix seconds. Defaults to now }
                metadata: { $ref: "#/components/schemas/Metadata" }
      responses:
        "201":
          description: Recorded (check status and reason)
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "200":
          description: Duplicate event_id, original returned
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      tags: [Events]
      summary: List events
      operationId: listEvents
      parameters:
        - in: query
          name: affiliate
          schema: { type: string }
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/EventStatus" }
        - in: query
          name: type
          schema: { type: string }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
      responses:
        "200":
          description: Page of events
          content: { application/json: { schema: { $ref: "#/components/schemas/EventList" } } }

  /v1/events/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Events]
      summary: Retrieve an event
      operationId: getEvent
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/events/{id}/reverse:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Events]
      summary: Reverse an event (refund, cancellation, fraud). Reverses its commission.
      operationId: reverseEvent
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        "200":
          description: Reversed
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/commissions:
    get:
      tags: [Commissions]
      summary: List commissions
      operationId: listCommissions
      parameters:
        - in: query
          name: affiliate
          schema: { type: string }
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/CommissionStatus" }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
      responses:
        "200":
          description: Page of commissions
          content: { application/json: { schema: { $ref: "#/components/schemas/CommissionList" } } }

  /v1/commissions/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Commissions]
      summary: Retrieve a commission
      operationId: getCommission
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/Commission" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/commissions/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Commissions]
      summary: Approve a pending commission before its hold ends
      operationId: approveCommission
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Approved
          content: { application/json: { schema: { $ref: "#/components/schemas/Commission" } } }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/commissions/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Commissions]
      summary: Reject a pending commission
      operationId: rejectCommission
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        "200":
          description: Rejected
          content: { application/json: { schema: { $ref: "#/components/schemas/Commission" } } }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/commissions/{id}/mark_paid:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Commissions]
      summary: Record that you paid this approved commission (informational)
      operationId: markCommissionPaid
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [payout_reference]
              properties:
                payout_reference: { type: string, maxLength: 191 }
      responses:
        "200":
          description: Recorded
          content: { application/json: { schema: { $ref: "#/components/schemas/Commission" } } }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/stats/summary:
    get:
      tags: [Stats]
      summary: Program-wide stats
      operationId: getSummaryStats
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - in: query
          name: group_by
          schema: { type: string, enum: [none, day, product, campaign, affiliate], default: none }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/Stats" } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Secret API key, pv_test_sk_... or pv_live_sk_...

  parameters:
    PathId:
      in: path
      name: id
      required: true
      schema: { type: string }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, maxLength: 255 }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    StartingAfter:
      in: query
      name: starting_after
      description: Cursor, the id of the last object on the previous page
      schema: { type: string }
    From:
      in: query
      name: from
      description: Unix seconds, inclusive. Default 30 days ago.
      schema: { type: integer }
    To:
      in: query
      name: to
      description: Unix seconds, exclusive. Default now. Max range 366 days.
      schema: { type: integer }

  responses:
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Missing or invalid API key
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Resource not found (also returned for other partners' resources)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Idempotency conflict
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unprocessable:
      description: Valid request but not allowed in the resource's current state
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Metadata:
      type: object
      maxProperties: 20
      additionalProperties: { type: string, maxLength: 500 }

    AffiliateStatus:
      type: string
      enum: [active, suspended, closed]
    EventStatus:
      type: string
      enum: [attributed, unattributed, rejected, reversed]
    CommissionStatus:
      type: string
      enum: [pending, approved, rejected, reversed]

    Affiliate:
      type: object
      required: [object, id, external_user_id, status, livemode, created]
      properties:
        object: { type: string, const: affiliate }
        id: { type: string, example: aff_3kP9... }
        external_user_id: { type: string }
        status: { $ref: "#/components/schemas/AffiliateStatus" }
        email: { type: [string, "null"] }
        display_name: { type: [string, "null"] }
        metadata: { $ref: "#/components/schemas/Metadata" }
        livemode: { type: boolean }
        created: { type: integer }

    Link:
      type: object
      required: [object, id, affiliate, code, url, destination_url, status, livemode, created]
      properties:
        object: { type: string, const: link }
        id: { type: string, example: lnk_7Hq2... }
        affiliate: { type: string }
        code: { type: string, example: k7Hq2mXa }
        url:
          type: string
          format: uri
          description: Built from the server's PUBLIC_REDIRECT_BASE_URL setting, so the host differs by environment. Use the returned value as is and never hardcode the host.
          example: "https://redirect.example.com/r/k7Hq2mXa"
        product_ref: { type: [string, "null"] }
        campaign_ref: { type: [string, "null"] }
        destination_url: { type: string, format: uri }
        status: { type: string, enum: [active, disabled] }
        metadata: { $ref: "#/components/schemas/Metadata" }
        livemode: { type: boolean }
        created: { type: integer }

    Event:
      type: object
      required: [object, id, event_id, type, status, livemode, occurred_at, created]
      properties:
        object: { type: string, const: event }
        id: { type: string, example: evt_Zx81... }
        event_id: { type: string, description: Your id }
        type: { type: string }
        status: { $ref: "#/components/schemas/EventStatus" }
        reason:
          type: [string, "null"]
          enum: [null, no_click, outside_window, self_referral, affiliate_suspended, fraud_suspected, link_disabled, reversed_by_partner]
        affiliate: { type: [string, "null"] }
        link: { type: [string, "null"] }
        click: { type: [string, "null"] }
        commission: { type: [string, "null"] }
        referred_external_user_id: { type: [string, "null"] }
        amount: { type: [integer, "null"] }
        currency: { type: [string, "null"] }
        metadata: { $ref: "#/components/schemas/Metadata" }
        livemode: { type: boolean }
        occurred_at: { type: integer }
        created: { type: integer }

    Commission:
      type: object
      required: [object, id, event, affiliate, affiliate_external_user_id, amount, currency, status, livemode, created]
      properties:
        object: { type: string, const: commission }
        id: { type: string, example: com_Pq0a... }
        event: { type: string }
        affiliate: { type: string }
        affiliate_external_user_id:
          type: string
          description: The partner's own user id for the affiliate, copied from the affiliate when the commission is created. Use it to match the commission to your own user. Never changes.
        amount: { type: integer }
        currency: { type: string }
        status: { $ref: "#/components/schemas/CommissionStatus" }
        hold_until: { type: integer }
        approved_at: { type: [integer, "null"] }
        rejected_at: { type: [integer, "null"] }
        reversed_at: { type: [integer, "null"] }
        paid_at: { type: [integer, "null"] }
        payout_reference: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        livemode: { type: boolean }
        created: { type: integer }

    StatsTotals:
      type: object
      properties:
        clicks: { type: integer }
        unique_clicks: { type: integer }
        conversions: { type: integer, description: Attributed events, net of reversals }
        conversion_rate: { type: number, description: conversions / unique_clicks, 0 if no clicks }
        commissions:
          type: object
          properties:
            pending: { $ref: "#/components/schemas/MoneyCount" }
            approved: { $ref: "#/components/schemas/MoneyCount" }
            paid: { $ref: "#/components/schemas/MoneyCount" }
            reversed: { $ref: "#/components/schemas/MoneyCount" }
        active_affiliates: { type: integer, description: Summary only. Affiliates with at least one click in range }

    MoneyCount:
      type: object
      properties:
        count: { type: integer }
        amount: { type: integer }
        currency: { type: [string, "null"] }

    Stats:
      type: object
      required: [object, from, to, totals]
      properties:
        object: { type: string, const: stats }
        from: { type: integer }
        to: { type: integer }
        totals: { $ref: "#/components/schemas/StatsTotals" }
        groups:
          type: array
          items:
            allOf:
              - type: object
                properties:
                  key: { type: string, description: "Date (YYYY-MM-DD), product_ref, campaign_ref or affiliate id" }
              - $ref: "#/components/schemas/StatsTotals"

    ListBase:
      type: object
      required: [object, data, has_more]
      properties:
        object: { type: string, const: list }
        has_more: { type: boolean }
    AffiliateList:
      allOf:
        - $ref: "#/components/schemas/ListBase"
        - type: object
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/Affiliate" } }
    LinkList:
      allOf:
        - $ref: "#/components/schemas/ListBase"
        - type: object
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/Link" } }
    EventList:
      allOf:
        - $ref: "#/components/schemas/ListBase"
        - type: object
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/Event" } }
    CommissionList:
      allOf:
        - $ref: "#/components/schemas/ListBase"
        - type: object
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/Commission" } }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, code, message, request_id]
          properties:
            type:
              type: string
              enum: [invalid_request_error, authentication_error, permission_error, idempotency_error, rate_limit_error, api_error]
            code: { type: string }
            message: { type: string }
            param: { type: [string, "null"] }
            request_id: { type: string }

    WebhookEvent:
      type: object
      description: Body POSTed to partner webhook endpoints. Verify the PV-Signature header.
      required: [id, type, livemode, created, api_version, data]
      properties:
        id: { type: string, example: whevt_... }
        type:
          type: string
          enum:
            - affiliate.created
            - affiliate.updated
            - link.created
            - conversion.attributed
            - conversion.unattributed
            - conversion.rejected
            - conversion.reversed
            - commission.created
            - commission.approved
            - commission.rejected
            - commission.reversed
            - commission.paid
        livemode: { type: boolean }
        created: { type: integer }
        api_version: { type: string }
        data:
          type: object
          properties:
            object:
